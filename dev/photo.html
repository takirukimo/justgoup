<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E10" />
    <title>PHOTO dev harness · STEIBOCK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #0D0E10; overflow: hidden; overscroll-behavior: none; }
      body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #0D0E10; }
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D0E10; contain: strict; }
      @media (min-aspect-ratio: 3/4) and (min-width: 700px) {
        #app { height: min(100%, 940px); width: auto; aspect-ratio: 9 / 19.5; border-radius: 34px;
               box-shadow: 0 0 0 1px #24272c, 0 0 0 10px #0a0b0c, 0 0 0 11px #2a2d33, 0 40px 120px rgba(0,0,0,.7); }
      }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      /* dev chrome: sample walls + the result */
      #dev { position: absolute; left: 16px; right: 16px; bottom: 24px; z-index: 3; display: none; flex-direction: column; gap: 10px;
             font: 600 11px/1.4 'JetBrains Mono', monospace; letter-spacing: .12em; color: #E9E5DD; pointer-events: auto; }
      #dev.on { display: flex; }
      #dev .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      #dev button { min-height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(23,25,29,.92);
                    color: #F6F4EF; font: 700 15px/1 'Barlow Condensed', sans-serif; letter-spacing: .12em; }
      #dev button.go { background: #D54051; border: 0; color: #fff; }
      #dev pre { margin: 0; max-height: 34vh; overflow: auto; padding: 12px; border-radius: 12px; background: rgba(13,14,16,.88);
                 border: 1px solid rgba(255,255,255,.08); font: 500 10.5px/1.45 'JetBrains Mono', monospace; letter-spacing: 0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="app">
        <canvas id="gl"></canvas>
        <div id="ui"></div>
        <div id="dev"></div>
      </div>
    </div>
    <script type="module" src="./photo.ts"></script>
  </body>
</html>
