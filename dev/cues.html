<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Body cues harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0e10; overflow: hidden; touch-action: none; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; left: 8px; bottom: 8px; font: 500 10px/1.4 ui-monospace, monospace; color: #9ad4de;
             white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; opacity: .85; }
      #hud.hide { display: none; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <script type="module" src="./cues.ts"></script>
  </body>
</html>
