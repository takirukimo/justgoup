<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E10" />
    <title>Sim Lab</title>
    <style>
      :root {
        --basalt: #0d0e10;
        --graphite: #17191d;
        --slate: #23272e;
        --fog: #8b929c;
        --bone: #e9e5dd;
        --signal: #ff4f1f;
        --good: #4fd18b;
        --warn: #ffb23f;
        --bad: #ff4545;
        --hair: rgba(255, 255, 255, 0.08);
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--basalt); color: var(--bone); overflow: hidden; }
      body { font: 500 13px/1.3 system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
      #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
      header { padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--hair); }
      header .label { font: 500 10px/1 var(--mono); letter-spacing: 0.18em; color: var(--fog); text-transform: uppercase; }
      header h1 { margin: 4px 0 0; font: 700 26px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
      .chip { margin-left: auto; padding: 6px 10px; border-radius: 999px; font: 700 13px/1 var(--display); letter-spacing: 0.08em; color: #0d0e10; }
      .angle { font: 500 11px/1 var(--mono); color: var(--fog); letter-spacing: 0.1em; padding-bottom: 6px; }
      canvas { width: 100%; height: 100%; display: block; }
      footer { padding: 10px 16px calc(env(safe-area-inset-bottom) + 12px); border-top: 1px solid var(--hair); background: rgba(13, 14, 16, 0.82); backdrop-filter: blur(18px) saturate(1.2); }
      .meters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
      .meter .k { font: 500 9px/1 var(--mono); letter-spacing: 0.18em; color: var(--fog); }
      .meter .v { font: 700 22px/1.1 var(--display); letter-spacing: 0.04em; }
      .bar { height: 3px; background: var(--slate); border-radius: 2px; overflow: hidden; margin-top: 4px; }
      .bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.12s; }
      .limbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
      .limb { font: 500 10px/1.2 var(--mono); color: var(--fog); }
      .limb b { color: var(--bone); font-weight: 700; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; height: 44px; border-radius: 14px; border: 1px solid var(--hair); background: var(--graphite); color: var(--bone); font: 700 14px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; }
      button:active { transform: scale(0.97); background: var(--slate); }
      button.on { border-color: var(--signal); color: var(--signal); }
      #log { position: absolute; left: 16px; top: 86px; font: 500 10px/1.5 var(--mono); color: var(--fog); pointer-events: none; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div>
          <div class="label" id="meta">CHIRAL SPORTS · SIM LAB</div>
          <h1 id="name">—</h1>
        </div>
        <span class="angle" id="angle"></span>
        <span class="chip" id="grade">V0</span>
      </header>
      <canvas id="cv"></canvas>
      <footer>
        <div class="meters">
          <div class="meter"><div class="k">TENSION</div><div class="v" id="tension">0.00</div><div class="bar"><i id="tensionBar"></i></div></div>
          <div class="meter"><div class="k">PUMP</div><div class="v" id="pump">0%</div><div class="bar"><i id="pumpBar"></i></div></div>
          <div class="meter"><div class="k">TIME</div><div class="v" id="time">0.0</div><div class="bar"><i id="topBar"></i></div></div>
        </div>
        <div class="limbs" id="limbs"></div>
        <div class="row">
          <button id="prev">− V</button>
          <button id="next">+ V</button>
          <button id="new">New</button>
          <button id="bot">Bot</button>
          <button id="hint">Hint</button>
        </div>
      </footer>
      <div id="log"></div>
    </div>
    <script type="module" src="./sim.ts"></script>
  </body>
</html>
