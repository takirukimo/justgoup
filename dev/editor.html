<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E10" />
    <title>EDITOR dev harness · Just Go Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #0D0E10; overflow: hidden; overscroll-behavior: none; }
      body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #0D0E10; }
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D0E10; contain: strict; }
      @media (min-aspect-ratio: 3/4) and (min-width: 700px) {
        #app { height: min(100%, 940px); width: auto; aspect-ratio: 9 / 19.5; border-radius: 34px;
               box-shadow: 0 0 0 1px #24272c, 0 0 0 10px #0a0b0c, 0 0 0 11px #2a2d33, 0 40px 120px rgba(0,0,0,.7); }
      }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #controls, #ui { position: absolute; inset: 0; }
      #ui { pointer-events: none; }
      /* stand-in for the app's test climb */
      #testclimb { position: absolute; inset: auto 16px 24px 16px; z-index: 20; display: none; gap: 8px; flex-direction: column;
                   font: 600 11px/1.3 'JetBrains Mono', monospace; letter-spacing: .14em; color: #E9E5DD; }
      #testclimb.on { display: flex; }
      #testclimb .row { display: flex; gap: 8px; }
      #testclimb button { flex: 1; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(23,25,29,.9);
                          color: #F6F4EF; font: 700 16px/1 'Barlow Condensed', sans-serif; letter-spacing: .14em; }
      #testclimb button.go { background: #FF4F1F; color: #0D0E10; border: 0; }
      #reopen { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 20; display: none; height: 52px; padding: 0 22px;
                border-radius: 14px; border: 0; background: #FF4F1F; color: #0D0E10; font: 700 16px/1 'Barlow Condensed', sans-serif; letter-spacing: .14em; }
      #reopen.on { display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="app">
        <canvas id="gl"></canvas>
        <div id="controls"></div>
        <div id="ui"></div>
        <div id="testclimb"><span>DEV · TEST CLIMB STAND-IN</span><div class="row"><button id="fell">FELL</button><button id="sent" class="go">SENT</button></div></div>
        <button id="reopen">OPEN EDITOR</button>
      </div>
    </div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
