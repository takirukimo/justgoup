<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E10" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STEIBOCK" />
    <meta name="description" content="STEIBOCK by CHIRAL SPORTS — a handheld 3D bouldering and lead-climbing game. Move every limb, keep your balance, send." />
    <title>STEIBOCK · by CHIRAL SPORTS</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      /* Critical boot styles — the full design system lives in src/ui/styles.css */
      /* Fixed full-bleed stage (no 100vh: mobile toolbars resize it), no pull-to-refresh / rubber band,
         no pinch or double-tap zoom, no long-press callouts. */
      html, body { margin: 0; height: 100%; background: #0D0E10; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
             -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #0D0E10; }
      /* Handheld format: full-bleed on phones, a centred portrait device on wide screens. */
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D0E10; contain: strict; }
      @media (min-aspect-ratio: 3/4) and (min-width: 700px) {
        #app { height: min(100%, 940px); width: auto; aspect-ratio: 9 / 19.5; border-radius: 34px;
               box-shadow: 0 0 0 1px #24272c, 0 0 0 10px #0a0b0c, 0 0 0 11px #2a2d33, 0 40px 120px rgba(0,0,0,.7); }
      }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #controls, #ui { position: absolute; inset: 0; }
      #ui { pointer-events: none; }
      #boot { position: absolute; inset: 0; display: grid; place-items: center; color: #E9E5DD;
              font: 600 12px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .3em; transition: opacity .6s; }
      /* Portrait game: a phone held sideways gets a "turn upright" card (main.ts pauses the climb).
         Keep the media query in sync with SIDEWAYS_QUERY in src/main.ts. */
      #rotate { display: none; }
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 540px) {
        #rotate { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px;
                  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
                  background: #0D0E10; color: #E9E5DD; text-align: center; }
        #rotate svg { width: 46px; height: 46px; color: #D54051; animation: jgu-turn 2.4s cubic-bezier(.2,.8,.2,1) infinite; }
        #rotate b { font: 800 26px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .1em; text-transform: uppercase; }
        #rotate span { font: 600 10px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .26em; color: #8B929C; text-transform: uppercase; }
      }
      @keyframes jgu-turn { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="app">
        <canvas id="gl"></canvas>
        <div id="controls"></div>
        <div id="ui"></div>
        <div id="boot">LOADING</div>
      </div>
    </div>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2.2" /><path d="M10.5 18.5h3" />
      </svg>
      <b>Turn your phone upright</b>
      <span>STEIBOCK is climbed in portrait</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
