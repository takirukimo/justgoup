<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E10" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Just Go Up" />
    <meta name="description" content="JUST GO UP — a premium handheld 3D bouldering game on the CHIRAL wall. Move every limb, keep your balance, send." />
    <title>Just Go Up</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      /* Critical boot styles — the full design system lives in src/ui/styles.css */
      html, body { margin: 0; height: 100%; background: #0D0E10; overflow: hidden; overscroll-behavior: none; }
      body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #0D0E10; }
      /* Handheld format: full-bleed on phones, a centred portrait device on wide screens. */
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D0E10; contain: strict; }
      @media (min-aspect-ratio: 3/4) and (min-width: 700px) {
        #app { height: min(100%, 940px); width: auto; aspect-ratio: 9 / 19.5; border-radius: 34px;
               box-shadow: 0 0 0 1px #24272c, 0 0 0 10px #0a0b0c, 0 0 0 11px #2a2d33, 0 40px 120px rgba(0,0,0,.7); }
      }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #controls, #ui { position: absolute; inset: 0; }
      #ui { pointer-events: none; }
      #boot { position: absolute; inset: 0; display: grid; place-items: center; color: #E9E5DD;
              font: 600 12px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .3em; transition: opacity .6s; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="app">
        <canvas id="gl"></canvas>
        <div id="controls"></div>
        <div id="ui"></div>
        <div id="boot">LOADING</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
